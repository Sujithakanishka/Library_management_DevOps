<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📤Issue Book</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="Body">
    <div class="container">
        <header>
        <h1>
            Get Your Book
        </h1>
    </header>
    <main>
        <form action="../issuebook" method="post">
             <div>
            <label for="studentid">Student ID </label>
            <input type="number" id="studentid" name="studentid" placeholder="Enter StudentID">
        </div>
        <div>
            <label for="bookID">Book ID</label>
            <input type="number" id="bookID" name="bookID" placeholder="Enter the BookID">
        </div>
        <div>
            <label for="borrowdate">Borrow Date</label>
            <input type="date" id="borrowdate" name="borrowdate" placeholder="Enter the BorrowDate">
        </div>
        <div>
            <label for="returndate">Return Date</label>
            <input type="date" id="returndate" name="returndate" placeholder="Enter the returndate">
        </div>
        <button type="submit" id="issuebtn">Issue Book</button>
        <button type="reset">Reset</button>
        <a href="dashboard.html">
            <button type="button">Back</button>
        </a>
        </form>
    </main>
     <script src="../js/addbook.js"></script>  
    </div>
</body>
</html>
