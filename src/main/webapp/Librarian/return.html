<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📤 Return Book</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="Body">
    <div class="container">
        <header>
        <h1>Return Book</h1>
    </header>
    <main>
         <form class="returnbook" action="../return" method="post">
        <div>
            <label for="borrowID">Borrow ID</label>
            <input type="number" id="borrowID" name="borrowID" placeholder="Enter the BorrowID">
        </div>
        <div>
            <label for="returndate">Return Date</label>
            <input type="date" id="returndate" name="returndate" placeholder="Enter the returndate">
        </div>
        <button type="submit">Return Book</button>
        <a href="dashboard.html">
            <button type="button">Back</button>
        </a>
        </form>
    </main>
    </div>
    <script src="../js/return.js"></script>
</body>
</html>
